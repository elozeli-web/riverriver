<script>
'use strict';
/* River Raid browser adaptation. Source references and deliberate differences
   from the TIA/6502 program are documented in ANALIZA-PORTU.md. No dependencies. */
const W=320,H=416,BLOCK=128,SECTION=BLOCK*16,STEP=1/60;
const CRUISE=120,MIN_SPEED=60,MAX_SPEED=240,INITIAL_LIVES=4,MAX_LIVES=10;
const POINTS={ship:30,heli:60,fuel:80,plane:100,bridge:500};
const BURN=32*60/65535*100,REFILL=256*60/65535*100;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sprites={
 jet:[8,8,8,28,62,127,127,107,73,8,28,62,42],
 banked:[8,8,8,24,60,62,62,46,10,8,24,60,46,2],
 ship:[16,16,48,120,255,254,252,124],
 heli:[28,28,7,4,14,159,255,255,142,4,14],
 heli2:[7,28,7,4,14,159,255,255,142,4,14],
 plane:[128,198,255,79,56,48],
 fuel:[124,222,206,222,222,254,214,214,214,198,254,198,222,206,222,198,254,222,222,222,222,198,254],
 house:[24,60,126,255,255,126,126,102,102,102],
};
// A faithful 16-bit feedback step from NextRandom16, seeded by SEED_HI/LO.
class LFSR{constructor(seed=0xA814){this.value=seed}next(){const hi=this.value>>>8;this.value=((this.value<<1)|(((hi<<3)^hi)>>>7&1))&65535;return this.value}}
function difficulty(n){return n<=48?n:47+((n-49)%2)}
class River{
 constructor(){this.stages=[];this.random=new LFSR()}
 ensure(index){while(this.stages.length<=index)this.build(this.stages.length)}
 build(index){
  const level=difficulty(index+1),straight=!!(level&1),easy=level<5;
  let state=0,prev={bank:12,island:0};
  const blocks=[],objects=[];
  for(let b=0;b<16;b++){
   let bits=this.random.next(),lo=bits&255,hi=bits>>>8,width;
   if(b===15){state=0;width=12}
   else if(straight){state=0;width=7}
   else{
    if(b===14){state=state===3?2:0}
    else if(state===1)state=3;
    else if(state===2)state=0;
    else if((lo&48)===0)state=state===3?2:1;
    width=(state===1||state===2)?0:Math.min((lo&15)<2?(lo&15)+2:lo&15,easy?8:state===3?13:14);
   }
   const next=state===3?{bank:0,island:width}:{bank:width,island:0};
   blocks.push({from:prev,to:next});prev=next;
   for(let z=0;z<2;z++){
    if(z){bits=this.random.next();lo=bits&255;hi=bits>>>8}
    let type=(b===0&&z===0)?'house':hi>(63-level)*2?['ship','heli','ship','heli','plane','ship','heli','heli'][hi&(level<3?1:7)]:(lo&64)?'house':'fuel';
    if(b===15&&z===1)type='bridge';
    const world=index*SECTION+b*BLOCK+z*64+32;
    objects.push({type,world,lo,hi,dir:(lo&128)?-1:1,stage:index});
   }
  }
  const stage={index,level,straight,blocks,templates:objects};this.stages.push(stage);
  for(const o of objects){
   const t=this.terrain(o.world),size=this.size(o.type);
   if(o.type==='bridge'){o.x=160;o.w=t.right-t.left;o.h=24;continue}
   if(o.type==='house'){o.x=t.islandRight-t.islandLeft>=40?160:(o.lo&128)?W-16:16;o.w=32;o.h=20;continue}
   let runs=this.corridors(o.world,size.h).filter(r=>r[1]-r[0]>=size.w+4);
   if(o.type==='ship'&&!runs.length){o.type='heli';size.w=16;size.h=22;runs=this.corridors(o.world,size.h).filter(r=>r[1]-r[0]>=size.w+4)}
   if(!runs.length)runs=this.corridors(o.world,size.h);
   let run=runs[(o.lo&128)&&runs.length>1?runs.length-1:0];
   const low=run[0]+size.w/2+2,high=run[1]-size.w/2-2;
   o.x=straight?clamp(104+(o.lo&63)*2,low,high):(o.lo&128)?high:low;
   o.w=size.w;o.h=size.h;
  }
 }
 size(type){return type==='ship'?{w:32,h:16}:type==='fuel'?{w:14,h:46}:type==='plane'?{w:16,h:12}:{w:16,h:22}}
 terrain(y){
  if(y<0)return{left:128,right:192,islandLeft:160,islandRight:160,stage:0};
  const s=Math.floor(y/SECTION);this.ensure(s);const b=Math.min(15,Math.floor((y-s*SECTION)/BLOCK));
  const local=y-s*SECTION-b*BLOCK,{from,to}=this.stages[s].blocks[b];
  // PF widths are four Atari pixels; each is eight canvas pixels. Step slopes
  // in the first half of a block, with a flat second sprite zone.
  const evolve=(a,c)=>a+Math.sign(c-a)*Math.min(Math.abs(c-a),Math.floor(local/4));
  const bank=evolve(from.bank,to.bank),island=evolve(from.island,to.island);
  return{left:32+bank*8,right:288-bank*8,islandLeft:160-island*8,islandRight:160+island*8,stage:s};
 }
 runs(t){return t.islandRight>t.islandLeft?[[t.left,t.islandLeft],[t.islandRight,t.right]]:[[t.left,t.right]]}
 corridors(world,height){let result=[[0,W]];for(let y=world-height/2;y<=world+height/2;y+=2){const next=[];for(const a of result)for(const b of this.runs(this.terrain(y))){const lo=Math.max(a[0],b[0]),hi=Math.min(a[1],b[1]);if(hi>lo)next.push([lo,hi])}result=next}return result}
 water(x,y,r=0){const t=this.terrain(y);return x-r>=t.left&&x+r<=t.right&&(!(t.islandRight>t.islandLeft)||(x+r<t.islandLeft||x-r>t.islandRight))}
}
class Game{
 constructor(onSound=()=>{}){this.onSound=onSound;this.mode='ready';this.best=0;try{this.best=Number(localStorage.getItem('river-raid-best-v1'))||0}catch{}this.reset();this.mode='ready'}
 reset(){this.river=new River();this.score=0;this.lives=INITIAL_LIVES;this.nextLife=10000;this.checkpoint=0;this.time=0;this.flash=0;this.banner='';this.bannerTime=0;this.load(0);this.mode='playing'}
 load(stage){this.camera=stage*SECTION;this.river.ensure(stage+1);this.objects=[];this.loaded=-1;this.loadObjects(stage);this.loadObjects(stage+1);this.player={x:160,y:354,vx:0};this.speed=CRUISE;this.fuel=100;this.bullet=null;this.particles=[];this.texts=[];this.refueling=false;this.invulnerable=1.6;this.deathTime=0;this.reason='';this.banner='ETAP '+String(stage+1).padStart(2,'0');this.bannerTime=2.3}
 loadObjects(stage){if(stage<=this.loaded)return;this.river.ensure(stage);for(const x of this.river.stages[stage].templates)this.objects.push({...x,dead:false,moving:false,patrolClock:.5+(x.lo/255)*4});this.loaded=stage}
 start(){this.reset()}
 pause(){if(this.mode==='playing'){this.mode='paused';return}if(this.mode==='paused')this.mode='playing'}
 award(points){this.score+=points;while(this.score>=this.nextLife){this.lives=Math.min(MAX_LIVES,this.lives+1);this.nextLife+=10000;this.banner='+1 ŻYCIE';this.bannerTime=2;this.onSound('life')}if(this.score>this.best){this.best=this.score;try{localStorage.setItem('river-raid-best-v1',String(this.best))}catch{}}}
 burst(x,y,color,count=16){for(let i=0;i<count;i++){const a=i*2.39996;this.particles.push({x,y,vx:Math.cos(a)*(20+(i%5)*17),vy:Math.sin(a)*(20+(i%7)*12),life:.35+(i%6)*.08,max:.8,color})}}
 kill(reason){if(this.mode!=='playing')return;this.lives--;this.mode='dying';this.deathTime=1.35;this.reason=reason;this.refueling=false;this.bullet=null;this.burst(this.player.x,this.player.y,'#f2ca68',36);this.onSound('crash');this.flash=.2}
 destroy(o){if(o.dead)return;o.dead=true;this.award(POINTS[o.type]||0);const y=H-(o.world-this.camera);this.burst(o.x,y,o.type==='fuel'?'#fc8155':'#efd65e',o.type==='bridge'?30:18);this.texts.push({x:o.x,y:y-8,text:'+'+POINTS[o.type],life:.8});this.onSound(o.type==='bridge'?'bridge':'hit');if(o.type==='bridge'){this.banner='MOST ZNISZCZONY';this.bannerTime=1.6}}
 tick(dt,input={}){
  if(this.mode==='ready'||this.mode==='paused'||this.mode==='gameover')return;
  this.time+=dt;this.flash=Math.max(0,this.flash-dt);this.bannerTime=Math.max(0,this.bannerTime-dt);
  for(const p of this.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}this.particles=this.particles.filter(p=>p.life>0);
  for(const p of this.texts){p.y-=23*dt;p.life-=dt}this.texts=this.texts.filter(p=>p.life>0);
  if(this.mode==='dying'){this.deathTime-=dt;if(this.deathTime<=0){if(this.lives<=0)this.mode='gameover';else{this.load(this.checkpoint);this.mode='playing'}}return}
  const drag=Array.isArray(input.drag)?input.drag:null,path=[];
  const dx=(input.right?1:0)-(input.left?1:0),dy=drag?Math.sign(drag.reduce((sum,p)=>sum+p.dy,0)):(input.down?1:0)-(input.up?1:0);
  if(drag){
   // Touch displacement is consumed once, with no held direction or inertia.
   this.player.vx=0;
   for(const move of drag){
    const x=this.player.x,y=this.player.y,nx=clamp(x+move.dx,8,W-8),ny=clamp(y+move.dy,H*.56,H*.89);
    const count=Math.ceil(Math.max(Math.abs(nx-x),Math.abs(ny-y))/2);
    for(let i=1;i<=count;i++)path.push({x:x+(nx-x)*i/count,y:y+(ny-y)*i/count});
    this.player.x=nx;this.player.y=ny;
   }
  }else{
   this.player.vx=dx?Math.sign(dx)*Math.min(120,Math.abs(this.player.vx)+230*dt):0;
   this.player.x=clamp(this.player.x+this.player.vx*dt,8,W-8);
   this.player.y=clamp(this.player.y+dy*58*dt,H*.56,H*.89);
  }

 draw(g,bank=0){const c=this.ctx,v=this.view(g),scene=this.sceneCtx;

  if(g.mode==='dying'){c.fillStyle='#18241fed';c.fillRect(40,185,240,58);c.fillStyle='#efdf91';c.font='bold 11px monospace';c.textAlign='center';c.fillText('SAMOLOT UTRACONY',160,205);c.font='8px monospace';c.fillText(g.reason,160,224)}
  if(g.flash>0){c.fillStyle='#f1b36c';c.globalAlpha=g.flash*.7;c.fillRect(0,0,W,H);c.globalAlpha=1}

}

class GraphicsRenderer{
 constructor(canvas){this.canvas=canvas;this.classic=new Renderer(canvas);this.modern=new ModernRenderer(canvas);this.cockpit=new CockpitRenderer(canvas);this.bank=new AircraftBank();this.mode='classic';this.setMode('classic')}
 setMode(mode){this.mode=['classic','modern','cockpit'].includes(mode)?mode:'classic';const s=this.mode==='modern'?this.modern.resolution:1;this.canvas.width=W*s;this.canvas.height=H*s;const c=this.classic.ctx;c.setTransform(s,0,0,s,0,0);c.imageSmoothingEnabled=this.mode==='modern'}

}

const $=id=>document.getElementById(id),sound=new Sound(),game=new Game(k=>sound.play(k)),renderer=new GraphicsRenderer($('game'));

  if(visible){const paused=game.mode==='paused',over=game.mode==='gameover';$('overlayTag').textContent=paused?'CHWILA ODDECHU':over?'MISJA ZAKOŃCZONA':'GOTOWOŚĆ DO STARTU';$('overlayTitle').textContent=paused?'Lot wstrzymany.':over?'Jeszcze jeden lot?':'Obierz kurs na północ.';$('overlayText').textContent=paused?'Rzeka poczeka. Wróć do lotu, gdy będziesz gotowy.':over?game.reason+'. Wynik: '+game.score+' pkt. Ukończone etapy: '+game.checkpoint+'.':'Omijaj brzegi, zestrzeliwuj przeciwników i pilnuj paliwa. Każdy most otwiera kolejny etap.';$('start').textContent=paused?'WRÓĆ DO LOTU →':over?'SPRÓBUJ PONOWNIE →':'ROZPOCZNIJ LOT →';$('overlayHint').textContent=paused?'P / Esc / Enter — wznów':'lub naciśnij Enter / Spację'}

}
$('start').addEventListener('click',()=>game.mode==='paused'?pause():begin());$('restart').addEventListener('click',begin);$('pause').addEventListener('click',pause);
$('sound').addEventListener('click',()=>{sound.enabled=!sound.enabled;if(sound.enabled){sound.unlock();sound.play('preview')}sound.update(game,input());$('sound').textContent='Dźwięk: '+(sound.enabled?'wł.':'wył.');$('sound').setAttribute('aria-pressed',String(sound.enabled))});
for(const b of document.querySelectorAll('.tool'))b.addEventListener('click',e=>{if(e.detail)b.blur()});
window.addEventListener('keydown',e=>{
 if($('mobileSettings').open)return;
 const codes=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','Space','KeyP','KeyR','Escape','Enter'];if(!codes.includes(e.code)||e.ctrlKey||e.metaKey||e.altKey)return;

});window.addEventListener('keyup',e=>keyboard.delete(e.code));
window.addEventListener('blur',()=>{clearInput();if(game.mode==='playing'){game.pause();sync(true)}});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(game.mode==='playing'){game.pause();sync(true)}}});
for(const cv of document.querySelectorAll('[data-sprite]')){const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;drawSprite(ctx,cv.dataset.sprite,20,16,cv.dataset.sprite==='ship'?3:2,cv.dataset.sprite==='fuel'?1:2)}

function setGraphics(mode,persist=true){
 renderer.setMode(mode);const modern=renderer.mode==='modern';document.body.classList.toggle('modern',modern);document.body.classList.toggle('cockpit',renderer.mode==='cockpit');
 for(const [id,value] of [['graphicsClassic','classic'],['graphicsModern','modern'],['graphicsCockpit','cockpit']])$(id).setAttribute('aria-pressed',String(renderer.mode===value));

 for(const cv of document.querySelectorAll('[data-sprite]')){
  const scale=modern?3:1;cv.width=40*scale;cv.height=32*scale;const c=cv.getContext('2d');c.setTransform(scale,0,0,scale,0,0);c.imageSmoothingEnabled=modern;
  if(modern){const type=cv.dataset.sprite;if(type==='bridge'){c.translate(20,16);c.fillStyle='#3b657c';c.fillRect(-17,-7,34,14);c.strokeStyle='#a9ebf4';c.lineWidth=.8;c.strokeRect(-17,-7,34,14);c.setLineDash([3,3]);c.beginPath();c.moveTo(-16,0);c.lineTo(16,0);c.stroke();c.setLineDash([])}else{c.save();if(type==='fuel'){c.translate(0,7);c.scale(1,.6)}modernObject(c,{type,x:20,dir:1},16,0);c.restore()}}
  else drawSprite(c,cv.dataset.sprite,20,16,cv.dataset.sprite==='ship'?3:2,cv.dataset.sprite==='fuel'?1:2);

 renderer.draw(game);

for(const [id,mode] of [['graphicsClassic','classic'],['graphicsModern','modern'],['graphicsCockpit','cockpit']])$(id).addEventListener('click',e=>{setGraphics(mode);if(e.detail)$(id).blur()});
let savedGraphics=document.body.dataset.defaultGraphics||'classic';try{savedGraphics=localStorage.getItem(graphicsStorageKey)||savedGraphics}catch{}setGraphics(savedGraphics,false);

// Relative direct manipulation: preserve the offset to the plane on contact,
// then match each finger displacement in CSS pixels. No joystick/dead zone.
function resetDrag(discard=false){
 const pointer=drag.pointer;drag.pointer=null;drag.startY=0;if(discard)drag.moves=[];
 if(pointer!==null&&$('steerZone').hasPointerCapture(pointer))$('steerZone').releasePointerCapture(pointer);
}
function updateDrag(e){
 if(game.mode!=='playing'){resetDrag(true);return}
 const rect=$('game').getBoundingClientRect();if(!rect.width||!rect.height)return;
 const coalesced=e.getCoalescedEvents?e.getCoalescedEvents():[],samples=coalesced.length?coalesced:[e];
 for(const point of samples){
  const dx=(point.clientX-drag.lastX)*W/rect.width,dy=(point.clientY-drag.lastY)*H/rect.height;
  if(dx||dy)drag.moves.push({dx,dy});drag.lastX=point.clientX;drag.lastY=point.clientY;
 }
}
$('steerZone').addEventListener('pointerdown',e=>{
 if(e.button!==0||drag.pointer!==null||game.mode!=='playing')return;
 e.preventDefault();sound.unlock();drag.pointer=e.pointerId;drag.startY=e.clientY;drag.lastX=e.clientX;drag.lastY=e.clientY;
 $('steerZone').setPointerCapture(e.pointerId);
});
$('steerZone').addEventListener('pointermove',e=>{if(e.pointerId!==drag.pointer)return;e.preventDefault();updateDrag(e)});
$('steerZone').addEventListener('pointerup',e=>{if(e.pointerId!==drag.pointer)return;e.preventDefault();updateDrag(e);resetDrag()});

 if(e.button!==0||game.mode!=='playing')return;e.preventDefault();sound.unlock();
 touches.set(e.pointerId,'Space');$('fireZone').setPointerCapture(e.pointerId);
});
for(const type of ['pointerup','pointercancel','lostpointercapture'])$('fireZone').addEventListener(type,e=>{
 touches.delete(e.pointerId);if($('fireZone').hasPointerCapture(e.pointerId))$('fireZone').releasePointerCapture(e.pointerId);
});

const phoneQuery=matchMedia('(max-width:900px), (max-height:420px), (pointer:coarse)');
let settingsResume=false;
function settingsSync(){
 for(const [id,value] of [['menuClassic','classic'],['menuModern','modern'],['menuCockpit','cockpit']])$(id).setAttribute('aria-pressed',String(renderer.mode===value));
 $('menuSound').textContent='Dźwięk: '+(sound.enabled?'włączony':'wyłączony');$('menuSound').setAttribute('aria-pressed',String(sound.enabled));
 $('mobileMode').textContent=renderer.mode==='cockpit'?'KOKPIT · 8 BIT':renderer.mode==='modern'?'NOWOCZESNA HD':'KLASYCZNA';
}
function fitPhoneViewport(){
 const well=document.querySelector('.screen-well'),r=well.getBoundingClientRect();
 // The entire game remains visible. Only its CSS projection is resized.
 // On a desktop the river extends from the very top to the very bottom.
 const portrait=phoneQuery.matches&&matchMedia('(orientation:portrait)').matches;
 const width=Math.max(1,Math.floor(portrait?r.width:Math.min(r.width,r.height*W/H))),height=Math.max(1,Math.floor(r.height));
 const machine=document.querySelector('.machine');machine.style.setProperty('--field-width',width+'px');machine.style.setProperty('--field-height',height+'px');
}
function phoneLayout(){
 const active=phoneQuery.matches;document.documentElement.classList.toggle('phone-ui',active);document.body.classList.toggle('phone-ui',active);
 document.documentElement.classList.toggle('desktop-ui',!active);document.body.classList.toggle('desktop-ui',!active);

});

function frame(now){const elapsed=Math.min(.1,(now-previous)/1000);previous=now;accumulator+=elapsed;while(accumulator>=STEP){game.tick(STEP,consumeInput());accumulator-=STEP}sound.update(game,input());renderer.draw(game);if(now-lastUI>80){sync();lastUI=now}requestAnimationFrame(frame)}sync(true);renderer.draw(game);requestAnimationFrame(frame);
